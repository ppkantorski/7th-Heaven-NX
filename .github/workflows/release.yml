# Builds the Python-free release zips (tools/release.py) on one runner per
# target -- PyInstaller cannot cross-compile -- and attaches them to a DRAFT
# GitHub release for the pushed tag. Review the draft, then publish it.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match VERSION in 7th_heaven_nx.py. Run it by hand from the
# Actions tab (workflow_dispatch) to get the zips as artifacts without a
# release.
#
# Licensed under GPLv3
# Copyright (c) 2026 ppkantorski

name: Release
# The run's title in the Actions tab. Without it GitHub shows the tagged
# commit's message, which says nothing about the build.
run-name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'Release build (manual)' }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # one platform failing (e.g. a package with no wheel yet) must not
      # cancel the other five
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64,   runner: windows-2025 }
          - { target: windows-arm64, runner: windows-11-arm }
          - { target: macos-arm64,   runner: macos-15 }
          - { target: macos-x64,     runner: macos-15-intel }
          # 22.04: the oldest glibc still offered, so the zip runs on more distros
          - { target: linux-x64,     runner: ubuntu-22.04 }
          - { target: linux-arm64,   runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # capstone publishes no Windows arm64 wheel, so pip builds it from
      # source there. That needs CMake, plus the MSVC compiler and nmake on
      # PATH: the runner has Visual Studio installed but not in the
      # environment, so load its ARM64 vcvars into every later step.
      - name: CMake for capstone (Windows arm64)
        if: matrix.target == 'windows-arm64'
        run: python -m pip install cmake

      - name: MSVC ARM64 environment for capstone (Windows arm64)
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vs) { $vs = & $vswhere -latest -products * -property installationPath }
          if (-not $vs) { throw 'Visual Studio not found' }
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$bat`" arm64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Check the compiler is on PATH (Windows arm64)
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          Get-Command cl.exe, nmake.exe | Format-Table Name, Source

      - name: Build
        shell: bash
        run: >-
          python tools/release.py
          ${{ startsWith(github.ref, 'refs/tags/') && format('--tag {0}', github.ref_name) || '' }}

      - uses: actions/upload-artifact@v6
        with:
          name: 7th-Heaven-NX-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    # publish whatever built, even if one platform failed
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: 7th Heaven NX ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
